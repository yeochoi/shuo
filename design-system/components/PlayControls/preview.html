<!-- @dsCard group="Practice" height=110 subtitle="Previous, Play, Next" -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Noto+Serif+SC:wght@600&display=swap">
<div style="font-family:var(--font-sans);background:var(--bg);color:var(--ink);padding:16px;max-width:380px;width:100%">
<div style="display:grid;grid-template-columns:44px 1fr 44px;gap:12px;align-items:center">
<button type="button" disabled aria-label="Previous" style="width:44px;height:44px;border-radius:999px;border:0;background:var(--chip);color:var(--chevron);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button type="button" class="title" style="height:64px;border:0;border-radius:999px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-sans)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>Play</button>
<button type="button" aria-label="Next" style="width:44px;height:44px;border-radius:999px;border:0;background:var(--chip);color:var(--ink);display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div></div>
<script></script>
